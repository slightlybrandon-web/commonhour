function getAllTimezones() {
  if (typeof Intl.supportedValuesOf === "function") {
    try {
      const list = Intl.supportedValuesOf("timeZone");
      if (list && list.length) return list;
    } catch (e) {}
  }
  return FALLBACK_TZS;
}

function detectViewerTz() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  } catch (e) {
    return "UTC";
  }
}

function tzLabel(tz) {
  try {
    const offset = DateTime.now().setZone(tz).toFormat("ZZ");
    return `${tz.replace(/_/g, " ")} (UTC${offset})`;
  } catch (e) {
    return tz;
  }
}

function genCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function pad2(n) { return String(n).padStart(2, "0"); }

function minutesToLabel(mins) {
  const h24 = Math.floor(mins / 60);
  const m = mins % 60;
  const ampm = h24 >= 12 ? "PM" : "AM";
  let h12 = h24 % 12;
  if (h12 === 0) h12 = 12;
  return m === 0 ? `${h12} ${ampm}` : `${h12}:${pad2(m)} ${ampm}`;
}

function dateLabel(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const wd = d.toLocaleDateString(undefined, { weekday: "short" });
  const md = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return { wd, md };
}

function slotKey(date, mins) { return `${date}_${mins}`; }

const DURATION_OPTIONS = Array.from({ length: 12 }, (_, i) => (i + 1) * 30); // 30 min through 6 hours, every 30 min

function durationLabel(mins) {
  if (mins < 60) return `${mins} min`;
  const hours = mins / 60;
  return `${hours} hour${hours === 1 ? "" : "s"}`;
}

function heatColor(ratio) {
  if (ratio <= 0) return COLORS.heat0;
  if (ratio <= 0.2) return COLORS.heat1;
  if (ratio <= 0.4) return COLORS.heat2;
  if (ratio <= 0.6) return COLORS.heat3;
  if (ratio <= 0.8) return COLORS.heat4;
  return COLORS.heat5;
}

function isValidEmail(s) {

// ---------------- timezone-aware time helpers ----------------

function slotInstant(dateStr, minutes, zone) {
  const hh = Math.floor(minutes / 60), mm = minutes % 60;
  return DateTime.fromISO(`${dateStr}T${pad2(hh)}:${pad2(mm)}:00`, { zone });
}

// Row time labels, computed once against an anchor date and shared across
// columns. This assumes a constant UTC offset between the two zones across
// the whole plan, which is true except during the specific week a location
// changes clocks for daylight saving — a rare edge case we accept here.
function computeRowLabels(dates, slots, eventTz, displayTz) {
  const anchor = dates[0];
  return slots.map((m) => {
    const orig = slotInstant(anchor, m, eventTz);
    const conv = orig.setZone(displayTz);
    const dayDiff = Math.round(
      DateTime.fromISO(conv.toISODate()).diff(DateTime.fromISO(anchor), "days").days
    );
    const label = conv.toFormat(conv.minute === 0 ? "h a" : "h:mm a");
    return { minutes: m, label, dayDiff };
  });
}

function columnDateLabel(dateStr, slots, eventTz, displayTz) {
  if (!slots.length) return dateLabel(dateStr);
  const orig = slotInstant(dateStr, slots[0], eventTz);
  const conv = orig.setZone(displayTz);
  return dateLabel(conv.toISODate());
}

function toCalStamp(dt) {
  return dt.toUTC().toFormat("yyyyLLdd'T'HHmmss'Z'");
}

function googleCalendarUrl(title, startDT, endDT, details, location, attendeeEmails) {
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: `${toCalStamp(startDT)}/${toCalStamp(endDT)}`,
    details: details || "",
    location: location || "",
  });
  if (attendeeEmails && attendeeEmails.length) params.set("add", attendeeEmails.join(","));
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function outlookWebUrl(title, startDT, endDT, details, location, attendeeEmails) {
  const params = new URLSearchParams({
    subject: title,
    startdt: startDT.toUTC().toISO(),
    enddt: endDT.toUTC().toISO(),
    body: details || "",
    location: location || "",
  });
  if (attendeeEmails && attendeeEmails.length) params.set("to", attendeeEmails.join(";"));
  return `https://outlook.office.com/calendar/0/deeplink/compose?${params.toString()}`;
}

function downloadICS(title, startDT, endDT, details, location, attendees, organizerName, organizerEmail) {
  const uid = `${Date.now()}-${Math.random().toString(36).slice(2)}@timeblocked`;
  const esc = (s) => String(s || "").replace(/[\n\r]+/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Commonhour//EN",
    "METHOD:REQUEST",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${toCalStamp(DateTime.utc())}`,
    `DTSTART:${toCalStamp(startDT)}`,
    `DTEND:${toCalStamp(endDT)}`,
    `SUMMARY:${esc(title)}`,
  ];
  if (location) lines.push(`LOCATION:${esc(location)}`);
  if (details) lines.push(`DESCRIPTION:${esc(details)}`);
  if (organizerEmail) {
    lines.push(`ORGANIZER;CN=${esc(organizerName || organizerEmail)}:mailto:${organizerEmail}`);
  }
  (attendees || []).forEach(({ name, email }) => {
    lines.push(`ATTENDEE;CN=${esc(name || email)};ROLE=REQ-PARTICIPANT;RSVP=TRUE:mailto:${email}`);
  });
  lines.push("STATUS:CONFIRMED", "END:VEVENT", "END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${title.replace(/[^a-z0-9]/gi, "_") || "event"}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------------- Supabase data access ----------------

async function dbCreateEvent(id, doc, userId) {
  const { error } = await supabaseClient.from("events").insert({
    id,
    name: doc.name,
    dates: doc.dates,
    start_hour: doc.startMin,
    end_hour: doc.endMin,
    slot_min: doc.slotMin,
    default_duration: doc.defaultDuration,
    timezone: doc.timezone,
    location: doc.location || null,
    organizer_name: doc.organizerName || null,
    organizer_email: doc.organizerEmail || null,
    user_id: userId || null,
  });
  if (error) throw error;
}

async function dbGetEvent(id) {
  const { data, error } = await supabaseClient.rpc("get_plan", { p_id: id });
  if (error) throw error;
  if (!data || !data.length) return null;
  const row = data[0];
  return {
    name: row.name,
    dates: row.dates,
    startMin: row.start_hour,
    endMin: row.end_hour,
    slotMin: row.slot_min,
    defaultDuration: row.default_duration,
    timezone: row.timezone,
    location: row.location,
    organizerName: row.organizer_name,
    userId: row.user_id,
  };
}

// Persists the organizer's final choice server-side (booked date, slot,
// duration). Nothing tracked this before booking was purely a client-side
// calendar-link action — this is what auto-expiry (10 days after the
// booked date) is computed from, so it has to actually be saved.
async function dbBookPlan(eventId, dateStr, minutes, duration) {
  const { error } = await supabaseClient.rpc("book_plan", {
    p_id: eventId, p_date: dateStr, p_minutes: minutes, p_duration: duration,

}

// Deletion is permanent, so unlike admin *recognition* elsewhere in the
// app, this always goes through the server-side check that requires an
// actual signed-in session — never just a typed email. See migration 002.
async function dbDeletePlan(eventId) {
  const { error } = await supabaseClient.rpc("delete_plan", { p_id: eventId });
  if (error) throw error;
}

// ---------------- Auth (Supabase: magic link, OTP, or password) ----------------

async function sendMagicLink(email) {
  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname + window.location.search },
  });
  if (error) throw error;
}

// Password sign-up. If the email already has a password-based account,
// Supabase returns success with no new user created and no confirmation
// email sent (it deliberately doesn't reveal whether an account exists) —
// callers should treat that ambiguity the same as "check your email."
async function signUpWithPassword(email, password) {
  const { error } = await supabaseClient.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname + window.location.search },
  });
  if (error) throw error;
}

async function signInWithPassword(email, password) {
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) throw error;
}

async function sendPasswordReset(email) {
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname + window.location.search,
  });
  if (error) throw error;
}

async function signOut() {
  await supabaseClient.auth.signOut();
}

// Plans this account created, plus plans this account has responded to
// (matched by the account's own email) — the permanent, no-cost "for life"
// history feature. RLS on the events table only allows an authenticated
// user to see rows they created OR rows they've responded to, so a single
// plain select already returns exactly the right set; we split it here by
// checking which ones belong to this user_id.
async function dbGetMyPolls(userId) {
  const { data, error } = await supabaseClient
    .from("events")
    .select("id, name, created_at, user_id")
    .order("created_at", { ascending: false });
  if (error) throw error;
  return {
    created: (data || []).filter((r) => r.user_id === userId),
    responded: (data || []).filter((r) => r.user_id !== userId),
  };
}

// Returns true/false only — the organizer's email is never sent back to
// the browser, even to the person who correctly guessed it.
async function dbVerifyAdminEmail(id, email) {
  if (!email) return false;
  const { data, error } = await supabaseClient.rpc("verify_admin_email", { p_id: id, p_email: email.trim() });
  if (error) return false;
  return !!data;
}

const ADMIN_STORAGE_PREFIX = "tb_admin_";

function getStoredAdmin(id) {
  try {
    const raw = localStorage.getItem(ADMIN_STORAGE_PREFIX + id);
    if (!raw) return null;
    return JSON.parse(raw); // { email }
  } catch (e) {
    return null;
  }
}

function setStoredAdmin(id, email) {
  try {
    localStorage.setItem(ADMIN_STORAGE_PREFIX + id, JSON.stringify({ email }));
  } catch (e) {}
}


async function dbGetAvailability(eventId) {
  const { data, error } = await supabaseClient.rpc("get_plan_availability", { p_id: eventId });
  if (error) throw error;
  const out = {};
  (data || []).forEach((row) => {
    out[row.email] = { name: row.person_name, slots: row.slots || [] };
  });
  return out;
}

async function dbSaveAvailability(eventId, personName, email, slots) {
  const { error } = await supabaseClient.rpc("save_availability", {
    p_event_id: eventId,
    p_name: personName,
    p_email: email,
    p_slots: slots,
  });
  if (error) throw error;
}

    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (currentUser && authPromptOpen) {
      setAuthPromptOpen(false);
      setAuthEmail("");
      setAuthPassword("");
      setAuthMode("password");
      setAuthState("idle");
      setAuthError("");

  }, [currentUser]); // eslint-disable-line react-hooks/exhaustive-deps

  function resetAuthFeedback() {
    setAuthState("idle");
    setAuthError("");
  }

  async function handleSendMagicLink() {
    setAuthError("");
    if (!isValidEmail(authEmail)) {
      setAuthState("error");
      setAuthError("Enter a valid email.");
      return;
    }
    setAuthState("sending");
    try {
      await sendMagicLink(authEmail.trim());
      setAuthState("sent");
    } catch (e) {
      setAuthState("error");
      setAuthError((e && e.message) ? e.message : "Something went wrong sending the link.");
    }
  }

  async function handlePasswordSignIn() {
    setAuthError("");
    if (!isValidEmail(authEmail)) { setAuthState("error"); setAuthError("Enter a valid email."); return; }
    if (!authPassword) { setAuthState("error"); setAuthError("Enter your password."); return; }
    setAuthState("sending");
    try {
      await signInWithPassword(authEmail.trim(), authPassword);

    } catch (e) {
      setAuthState("error");
      const msg = (e && e.message) || "";
      setAuthError(
        msg.toLowerCase().indexOf("invalid") !== -1
          ? "Wrong email or password."
          : (msg || "Something went wrong signing in.")
      );
    }
  }

    if (!authPassword || authPassword.length < 8) { setAuthState("error"); setAuthError("Password needs to be at least 8 characters."); return; }
    setAuthState("sending");
    try {
      await signUpWithPassword(authEmail.trim(), authPassword);
      setAuthState("sent"); // Supabase may require email confirmation depending on project settings
    } catch (e) {
      setAuthState("error");
      setAuthError((e && e.message) ? e.message : "Something went wrong creating your account.");
    }
  }

      setShowResponseNudge(false);

    setCreateError("");

    if (formDates.length === 0) { setCreateError("Add at least one date."); return; }
    if (endMin <= startMin) { setCreateError("End time needs to be after the start time."); return; }
    if (!formOrgName.trim()) { setCreateError("Add your name \u2014 you'll be listed as the organizer."); return; }
    if (!isValidEmail(formOrgEmail)) { setCreateError("Add a valid email for yourself as the organizer."); return; }
    setBusy(true);
    const id = genCode();
    const doc = {
      name: formName.trim(),
      dates: formDates,
      startMin, endMin, slotMin: 30,
      defaultDuration: formDuration,
      timezone: formTz,
      location: formLocation.trim(),
      organizerName: formOrgName.trim(),
      organizerEmail: formOrgEmail.trim(),
      userId: currentUser ? currentUser.id : null,

      setActiveTab("mine");

      setAdminEmail(doc.organizerEmail);

      setCreateError("Couldn't create the plan. Try again.");

    setJoinError("");

    const ok = await loadEvent(code);
    if (!ok) setJoinError("We couldn't find a plan with that code.");

  async function shareEvent() {
    const url = `${window.location.origin}${window.location.pathname}?event=${eventId}`;
    const message = `Please choose your window of availability for our upcoming ${eventDoc.name}.`;
    if (navigator.share) {
      try {
        await navigator.share({ title: eventDoc.name, text: message, url });
      } catch (e) {} // user cancelled share sheet — no error needed
      return;
    }
    try {
      await navigator.clipboard.writeText(`${message}\n${url}`);
      setShareState("copied");
      setTimeout(() => setShareState("idle"), 1800);
    } catch (e) {
      setShareState("manual");
      setTimeout(() => setShareState("idle"), 2500);
    }
  }

  async function confirmAdminEmail() {
    setAdminPromptError("");
    if (!isValidEmail(adminPromptEmail)) { setAdminPromptError("Enter a valid email."); return; }
    setAdminPromptBusy(true);

    setAdminPromptBusy(false);

    setIsAdmin(true);
    setAdminEmail(adminPromptEmail.trim());

  // Deletion always goes through the server RPC (see migration 002), which
  // requires an actual signed-in session matching the plan's owner or
  // organizer email — never just the client-side "isAdmin" flag, since that
  // flag can be set anonymously by typing an email with no proof of
  // controlling it. If the person isn't signed in yet, this routes them
  // into sign-in (pre-filled with the email they already confirmed as
  // admin on this device, if any) rather than failing silently.
  async function handleDeletePlan() {
    setDeleteError("");
    if (!currentUser) {
      setDeleteConfirmOpen(false);
      setAuthEmail(adminEmail || "");
      setAuthMode("password");
      setAuthPromptOpen(true);
      return;
    }
    setDeleteBusy(true);
    try {
      await dbDeletePlan(eventId);
      goHome();
    } catch (e) {
      setDeleteBusy(false);
      const msg = (e && e.message) || "";
      setDeleteError(
        msg.indexOf("NOT_AUTHORIZED") !== -1
          ? "This account doesn't match the plan's organizer, so it can't delete this plan."
          : "Couldn't delete this plan. Try again."
      );
    }
  }

  // Plans in "Created by you" are always account-owned, so this delete is
  // guaranteed to satisfy delete_plan's server-side check (auth.uid()
  // matches the plan's user_id) — no sign-in detour needed here, unlike
  // the anonymous-admin case on the plan page itself.
  async function handleDashboardDelete(id, name, e) {
    e.stopPropagation();
    if (!window.confirm(`Delete "${name}" and every response? This can't be undone.`)) return;
    setDashboardDeletingId(id);
    setDashboardError("");
    try {
      await dbDeletePlan(id);
      setMyPolls((prev) => prev ? {
        created: prev.created.filter((p) => p.id !== id),
        responded: prev.responded.filter((p) => p.id !== id),
      } : prev);
    } catch (e) {
      setDashboardError("Couldn't delete that plan. Try again.");
    }
    setDashboardDeletingId(null);
  }

      setDashboardError((e && e.message) ? e.message : "Couldn't load your polls. Try again.");

    setPage("dashboard");
    setBusy(false);

  function cellSelected(key) { return selected.has(key); }

  function paintCell(key, mode) {
    setSelected((prev) => {
      const next = new Set(prev);
      if (mode) next.add(key); else next.delete(key);
      return next;
    });
  }

  function onCellDown(key) {
    const mode = !cellSelected(key);
    dragRef.current = { active: true, mode };
    paintCell(key, mode);
  }

  function onCellEnter(key) {
    if (!dragRef.current.active) return;
    paintCell(key, dragRef.current.mode);
  }

  function endDrag() { dragRef.current.active = false; }

  function confirmIdentity() {
    setConfirmError("");

  async function saveAvailability() {
    setSaveState("saving");

      setAvailDoc(avail);
      setSaveState("saved");
      if (!currentUser && !isAdmin) setShowResponseNudge(true);
      setTimeout(() => setSaveState("idle"), 1800);
    } catch (e) {
      setSaveState("error");
      if (e && e.message && e.message.indexOf("RESPONDENT_CAP_REACHED") !== -1) {
        setSaveError("This plan has reached its response limit for a no-account plan. Ask the organizer to sign in and create an account for unlimited responses.");
      } else {
        setSaveError("Couldn't save. Try again.");
      }
      setTimeout(() => setSaveState("idle"), 4000);
    }

    const people = [];
    for (const email of participantEmails) {

            );
          })()}

          {activeTab === "mine" && nameConfirmed && (

          {loadError && <p style={styles.errorText}>{loadError}</p>}

  return (

function ScheduleGrid({ dates, slots, eventTz, displayTz, mode, editable, selected, onCellDown, onCellEnter, countAt, totalParticipants, hoverInfo, setHoverInfo, chosenSlot, onCellClick, locked, notFreeAt }) {
  const cellH = 22, timeColW = 76, dateColW = 84;
  const rowLabels = computeRowLabels(dates, slots, eventTz, displayTz);
  const cellEditableGrid = editable && !locked;

  // Touch devices don't fire mouseenter across elements during a drag, so
  // dragging to select multiple cells needs its own handling: find whatever
  // cell is physically under the finger on each move, using elementFromPoint
  // plus a data-key attribute on each cell to identify it.
  function keyFromTouch(touch) {
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    return el && el.dataset ? el.dataset.key : null;
  }

  function handleTouchStart(e) {
    if (!cellEditableGrid) return;
    // Without this, iOS Safari still fires a synthetic "ghost click" ~300ms
    // after the finger lifts, targeted at whatever cell is under the finger
    // at lift-off (which can drift slightly during a tap) rather than where
    // the touch started — that's what was re-toggling the wrong cell on a
    // plain tap. Suppressing the default here stops iOS from synthesizing it.
    e.preventDefault();
    const key = keyFromTouch(e.touches[0]);
    if (key) onCellDown(key);
  }

  function handleTouchMove(e) {
    if (!cellEditableGrid) return;
    e.preventDefault();
    const key = keyFromTouch(e.touches[0]);
    if (key) onCellEnter(key);
  }

  return (
    <div style={{ position: "relative" }}>
      <div style={{ overflowX: "auto", paddingBottom: 8, opacity: locked ? 0.45 : 1, transition: "opacity 120ms" }}>
        <div
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          style={{ display: "grid", gridTemplateColumns: `${timeColW}px repeat(${dates.length}, ${dateColW}px)`, userSelect: "none", minWidth: timeColW + dates.length * dateColW }}
        >
          <div style={{ height: 40 }} />
          {dates.map((d) => {
            const { wd, md } = columnDateLabel(d, slots, eventTz, displayTz);
            return (
              <div key={d} style={{ height: 40, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", borderBottom: `1px solid ${COLORS.line}`, fontSize: 13 }}>
                <div style={{ color: COLORS.inkSoft, fontSize: 11 }}>{wd}</div>
                <div style={{ fontWeight: 500 }}>{md}</div>
              </div>
            );
          })}
          {slots.map((m, i) => {
            const rowInfo = rowLabels[i];
            const isHourStart = m % 60 === 0;
            return (
              <Fragment key={m}>
                <div style={{ height: cellH, fontSize: 11, color: COLORS.inkSoft, textAlign: "right", paddingRight: 8, position: "relative", top: -6 }}>
                  {isHourStart && (
                    <span>
                      {rowInfo.label}
                      {rowInfo.dayDiff !== 0 && (
                        <sup style={{ marginLeft: 2, color: COLORS.brass }}>{rowInfo.dayDiff > 0 ? `+${rowInfo.dayDiff}` : rowInfo.dayDiff}</sup>
                      )}
                    </span>
                  )}
                </div>
                {dates.map((d) => {
                  const key = slotKey(d, m);
                  let bg = COLORS.paperRaised, title = "";
                  const isChosen = mode === "group" && chosenSlot && chosenSlot.date === d && chosenSlot.m === m;
                  const cellEditable = editable && !locked;
                  if (mode === "mine") {
                    bg = selected.has(key) ? COLORS.brass : COLORS.paperRaised;
                  } else {
                    const people = countAt(key);
                    const ratio = totalParticipants > 0 ? people.length / totalParticipants : 0;
                    bg = heatColor(ratio);
                    title = people.length > 0 ? people.map((p) => p.name).join(", ") : "";
                  }
                  return (
                    <div key={key}
                      data-key={key}
                      onMouseDown={() => cellEditable && onCellDown(key)}
                      onClick={() => mode === "group" && onCellClick && onCellClick(d, m)}
                      onMouseEnter={() => {
                        if (cellEditable) onCellEnter(key);
                        if (mode === "group") {
                          const people = countAt(key);
                          const absent = notFreeAt ? notFreeAt(key) : [];
                          setHoverInfo(people.length || absent.length ? { key, people, absent } : null);
                        }
                      }}
                      onMouseLeave={() => { if (mode === "group") setHoverInfo(null); }}
                      style={{ height: cellH, background: bg, borderLeft: `1px solid ${COLORS.lineSoft}`, borderTop: isHourStart ? `1px solid ${COLORS.line}` : `1px solid ${COLORS.lineSoft}`, outline: isChosen ? `2px solid ${COLORS.brassDeep}` : "none", outlineOffset: isChosen ? "-2px" : "0", cursor: cellEditable || mode === "group" ? "pointer" : "default", touchAction: cellEditable ? "none" : "auto", boxSizing: "border-box" }}
                      title={title}
                    />
                  );
                })}
              </Fragment>
            );
          })}
        </div>
      </div>
      {mode === "group" && hoverInfo && (hoverInfo.people.length > 0 || hoverInfo.absent.length > 0) && (
        <div style={{ marginTop: 10, fontSize: 13, color: COLORS.ink, background: COLORS.paperRaised, border: `1px solid ${COLORS.line}`, borderRadius: 4, padding: "8px 12px", display: "inline-block" }}>
          {hoverInfo.people.length > 0 && <div>Free: {hoverInfo.people.map((p) => p.name).join(", ")}</div>}
          {hoverInfo.absent.length > 0 && <div style={{ color: COLORS.inkSoft }}>Not free: {hoverInfo.absent.map((p) => p.name).join(", ")}</div>}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CommonhourApp />);
</script>
</body>
</html>
